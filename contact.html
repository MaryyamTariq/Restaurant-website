<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saffron Spice - Contact Us</title>
  <link rel="stylesheet" href="Css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">Saffron Spice</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="hamburger">&#9776;</div>
    </nav>
  </header>

  
  <main>
    <section class="page-header" style="text-align: center; padding: 3rem 1rem 1rem;">
      <h1>Get in Touch</h1>
      <p style="color: #666; margin-top: 0.5rem;">We would love to hear from you or reserve a table for your next visit.</p>
    </section>

    <!-- Contact Section -->
    <section class="contact-section" style="max-width: 600px; margin: 2rem auto; padding: 0 1rem 4rem;">
      <form id="contactForm" style="background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <div style="margin-bottom: 1.5rem;">
          <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Your Email</label>
          <input type="email" id="email" placeholder="Enter your email" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Your Message</label>
          <textarea id="message" rows="5" placeholder="Write your message..... " required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; resize: vertical;"></textarea>
        </div>

        <button type="submit" style="background: #e67e22; color: white; border: none; padding: 0.8rem 2rem; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%;">Send Message</button>
      </form>
    </section>
  </main>


  <footer>
    <p>&copy; 2026 Saffron Spice Restaurant. All Rights Reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
